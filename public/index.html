<!DOCTYPE html>
<!-- lang is rewritten per request by server/middleware/ssrMeta.js; "is" is the
     right static default because that is what an unprefixed URL resolves to. -->
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta -->
  <title>Orange Smiley — hugbúnaðarhús knúið gervigreind</title>
  <meta name="description" content="Íslenskt hugbúnaðarhús knúið gervigreind. Við smíðum hugbúnað fyrir lítil og meðalstór fyrirtæki: sérsmíðuð kerfi, vefi, vefverslanir og Rekstrarkerfið." />
  <meta name="robots" content="index, follow" id="ssr-robots" />
  <meta name="author" content="Orange Smiley ehf." />

  <!-- Search engine ownership verification — populated by server SSR from the
       GOOGLE_VERIFICATION_TOKEN and BING_VERIFICATION_TOKEN env vars (see
       server/middleware/ssrMeta.js). Set the env vars in Azure App Service
       after claiming the property in Search Console / Bing Webmaster Tools.
       Empty content is harmless — the tags only matter once a token lands. -->
  <meta name="google-site-verification" content="" />
  <meta name="msvalidate.01" content="" />
  <!-- Canonical + hreflang are filled in per-request by the server SSR
       middleware (server/middleware/ssrMeta.js) — these elements exist as
       default fallbacks when a route is rendered directly from a browser
       cache before SSR catches up. -->
  <link rel="canonical" href="https://www.hallismiley.is/" id="ssr-canonical" />
  <link rel="alternate" hreflang="en"        href="https://www.hallismiley.is/en/"        id="ssr-hreflang-en" />
  <link rel="alternate" hreflang="is"        href="https://www.hallismiley.is/is/"        id="ssr-hreflang-is" />
  <link rel="alternate" hreflang="x-default" href="https://www.hallismiley.is/"           id="ssr-hreflang-default" />

  <!-- Geo targeting -->
  <meta name="geo.region" content="IS" />
  <meta name="geo.placename" content="Iceland" />

  <!-- App environment (test|production) — stamped per-request by ssrMeta;
       the in-app feedback widget + TEST chrome appear only when this is "test". -->
  <meta name="app-env" content="production" id="ssr-app-env" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="is_IS" />
  <meta property="og:url" content="https://www.hallismiley.is/" />
  <meta property="og:title" content="Orange Smiley — hugbúnaðarhús knúið gervigreind" />
  <meta property="og:description" content="Íslenskt hugbúnaðarhús knúið gervigreind. Við smíðum hugbúnað fyrir lítil og meðalstór fyrirtæki: sérsmíðuð kerfi, vefi, vefverslanir og Rekstrarkerfið." />
  <meta property="og:image" content="https://www.hallismiley.is/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Orange Smiley" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Self-hosted fonts (latin + latin-ext woff2). Generated by
       scripts/self-host-fonts.js — see public/fonts/ for the files.
       Removed the Google Fonts CDN links (and their preconnects) to drop
       a third-party DNS + TLS round trip from the critical path. -->
  <link rel="stylesheet" href="/css/fonts.css" />

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Pre-paint theme application — must run before first paint to avoid a
       flash of the default theme. Classic blocking script, same-origin so it
       passes the helmet CSP script-src 'self'. See public/js/theme-boot.js. -->
  <script src="/js/theme-boot.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/main.css" />

  <!-- JSON-LD Structured Data. The @id matches the publisher reference in the
       WebSite schema emitted server-side on the homepage so search engines can
       stitch Organization + WebSite into one knowledge-graph entity. Change
       both together — a dangling publisher @id yields a broken graph.
       DRAFT: the kennitala (vatID/taxID) lands once registration completes. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://www.hallismiley.is/#organization",
    "name": "Orange Smiley ehf.",
    "alternateName": ["Orange Smiley", "Rekstrarkerfið"],
    "url": "https://www.hallismiley.is",
    "logo": "https://www.hallismiley.is/favicon.svg",
    "image": "https://www.hallismiley.is/og-image.jpg",
    "email": "info@orangesmiley.is",
    "description": "Icelandic software company building and operating websites, online stores and business systems for small and medium businesses — one platform, one monthly subscription.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "IS",
      "addressLocality": "Hafnarfjörður"
    },
    "areaServed": { "@type": "Country", "name": "Iceland" },
    "knowsAbout": [
      "Web Development", "E-commerce", "Inventory Management",
      "Invoicing", "VAT Accounting", "Shopify Migration",
      "Node.js", "PostgreSQL"
    ]
  }
  </script>

  <!-- Analytics: loaded only after cookie consent (see /js/consent.js).
       When you have a real GA4 Measurement ID, set window.GA_MEASUREMENT_ID
       before this script, or pass it to loadAnalytics() inside consent.js. -->
  <script src="/js/consent.js" defer></script>
</head>
<body>
  <!-- Re-translated by the SPA on boot (public/js/main.js) once messages
       load; the markup default is Icelandic to match <html lang>. -->
  <a href="#main-content" class="skip-nav" data-i18n="nav.skipToContent">Fara í meginmál</a>
  <div id="app"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
