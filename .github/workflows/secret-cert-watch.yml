name: Secret & certificate expiry watch

# Weekly watch for the two things that go quietly stale on an instance
# (ported from icelandicstore #90; harvest 2 lane 9, 2026-09-26):
#   1. TLS certificates on the instance hostnames. App Service managed
#      certificates renew themselves ~45 days out, so one inside 21 days means
#      the renewal FAILED.
#   2. Key Vault secrets: inside 30 days of their `expires` stamp, or with no
#      stamp at all (nothing would ever remind anyone to rotate those).
# The judging lives in scripts/expiry-watch.js (unit-tested); this file only
# gathers the inputs.
#
# Arming = set repository variables, no workflow edit (docs/DEPLOYMENT.md §7,
# "The expiry watch"; rotation steps in RUNBOOK.md):
#   vars.WATCH_HOSTS       hostnames, space-separated (e.g. "www.orangesmiley.is orangesmiley.is").
#                          The engine has no fleet manifest CI can read, so the
#                          host list is this variable. Empty = TLS half skipped.
#   vars.WATCH_KEY_VAULTS  vault names, space-separated (e.g. "orangesm-prod-kv").
#   secrets.AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID — the
#                          deploy identity's OIDC login (deploy.yml's pattern), as
#                          REPOSITORY secrets: this job runs in no environment, so
#                          its OIDC subject is ref:refs/heads/master. The identity
#                          holds Key Vault Reader: metadata only, never values.
#   Unset = that half is skipped with a warning and the run stays green, so a
#   repo without Azure (a fresh downstream) is not red every Monday.
#   (optional) vars.ALERT_EMAIL_TO / vars.ALERT_EMAIL_FROM + secrets.RESEND_API_KEY
#                          — the digest email, deploy.yml's alert pattern.
#
# Findings fail the run (GitHub notifies the repo's watchers) AND, when the
# alert vars are set, email a digest: names and dates only, never values.
on:
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC
  workflow_dispatch:
    inputs:
      warn_days:
        description: >-
          Override BOTH thresholds in days (default 21 for TLS, 30 for secrets).
          Set high (e.g. 400) to test the alert path.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: secret-cert-watch
  cancel-in-progress: true

jobs:
  watch:
    name: Check TLS certificates + vault secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # OIDC login to list vault secret METADATA
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave the token in .git/config for
          # the steps that follow the OIDC login.
          persist-credentials: false

      # What is armed? Secrets cannot be tested in `if:`, so this step reads
      # them into the environment and says which halves will run.
      - name: Decide what to watch
        id: plan
        env:
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          VAULTS: ${{ vars.WATCH_KEY_VAULTS }}
          HOSTS: ${{ vars.WATCH_HOSTS }}
        run: |
          # A variable holding only spaces counts as unset.
          HOSTS="$(printf '%s' "$HOSTS" | tr -d '[:space:]')"
          VAULTS="$(printf '%s' "$VAULTS" | tr -d '[:space:]')"
          if [ -z "$HOSTS" ]; then
            echo "::warning::vars.WATCH_HOSTS is not set — no TLS certificate is watched."
          fi
          if [ -n "$VAULTS" ] && [ -n "$AZ_CLIENT" ] && [ -n "$AZ_TENANT" ] && [ -n "$AZ_SUB" ]; then
            echo "kv=true" >> "$GITHUB_OUTPUT"
          else
            echo "kv=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Key Vault half skipped — needs vars.WATCH_KEY_VAULTS and the AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID repository secrets."
          fi

      - name: Azure Login (OIDC)
        if: steps.plan.outputs.kv == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Metadata only: `secret list` returns names and attributes, never a
      # value. An az failure fails the RUN — a watch that cannot read the
      # vault is a finding in itself, not a green week.
      - name: List vault secret metadata
        if: steps.plan.outputs.kv == 'true'
        env:
          VAULTS: ${{ vars.WATCH_KEY_VAULTS }}
        run: |
          set -euo pipefail
          echo '[]' > "$RUNNER_TEMP/secrets.json"
          for VAULT in $VAULTS; do
            if ! printf '%s' "$VAULT" | grep -Eq '^[A-Za-z0-9-]{3,24}$'; then
              echo "::error::'$VAULT' in vars.WATCH_KEY_VAULTS is not a vault name"; exit 1
            fi
            az keyvault secret list --vault-name "$VAULT" \
              --query "[].{name:name, expires:attributes.expires, enabled:attributes.enabled}" -o json \
              | jq --arg v "$VAULT" 'map(. + {vault: $v})' > "$RUNNER_TEMP/kv-$VAULT.json"
          done
          jq -s 'add // []' "$RUNNER_TEMP"/kv-*.json > "$RUNNER_TEMP/secrets.json"
          echo "Listed $(jq length "$RUNNER_TEMP/secrets.json") secret(s)."

      # No setup-node on purpose: the script is plain CommonJS with no
      # dependencies, and the runner's preinstalled Node runs it — so the Node
      # major stays pinned in its three places (Dockerfile, ci.yml, promote.yml).
      - name: Scan
        id: scan
        env:
          WATCH_HOSTS: ${{ vars.WATCH_HOSTS }}
          SECRETS_JSON: ${{ steps.plan.outputs.kv == 'true' && format('{0}/secrets.json', runner.temp) || '' }}
          TLS_WARN_DAYS: ${{ inputs.warn_days }}
          SECRET_WARN_DAYS: ${{ inputs.warn_days }}
          FINDINGS_FILE: ${{ runner.temp }}/findings.txt
        run: node scripts/expiry-watch.js

      - name: Email digest (Resend)
        if: steps.scan.outputs.found == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          FINDINGS_FILE: ${{ runner.temp }}/findings.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL_TO" ] || [ -z "$ALERT_EMAIL_FROM" ]; then
            echo "Alert email not configured (RESEND_API_KEY / ALERT_EMAIL_TO / ALERT_EMAIL_FROM) — the failed run is the alert."; exit 0
          fi
          ITEMS=$(sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' "$FINDINGS_FILE" | awk -F'|' '{printf "<li><code>%s</code> — %s</li>", $1, $2}')
          jq -n \
            --arg from "Orange Smiley Watch <$ALERT_EMAIL_FROM>" \
            --arg to "$ALERT_EMAIL_TO" \
            --arg repo "$REPO" \
            --arg items "$ITEMS" \
            --arg url "$RUN_URL" \
            '{
               from: $from,
               to: [$to],
               subject: ("🔑 " + $repo + " — certificates/secrets need attention"),
               html: ("<h2>Rotation needed</h2><p>The weekly watch found items at or near expiry:</p><ul>" + $items + "</ul>"
                 + "<p>Runbook: <code>RUNBOOK.md</code> → “Certificates and Key Vault secrets”. Every rotation stamps a new <code>--expires</code>.</p>"
                 + "<p><a href=\"" + $url + "\">View the run →</a></p>")
             }' \
            | curl -sS --fail-with-body -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d @-
          echo "Digest emailed."

      - name: Fail the run when findings exist
        if: steps.scan.outputs.found == 'true'
        run: |
          echo "::error::Certificates or secrets need attention — see the scan step above."
          exit 1
