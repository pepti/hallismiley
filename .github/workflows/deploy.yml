name: Deploy to Azure

# Deploy is gated on CI: it runs only after the CI workflow finishes
# successfully on main, deploying the exact SHA that CI validated.
# `workflow_dispatch` stays available as a manual override — used when
# we need to ship an image without re-running CI (e.g. after a
# subscription/billing outage where the previous CI was already green).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Default every job to read-only; the deploy job's own permissions block
# grants the OIDC id-token it needs and overrides this at job level.
permissions:
  contents: read

# Two deploys must never interleave (each ends in a webapp restart); queue
# them instead of cancelling — a cancelled deploy would strand main un-shipped.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Fail closed: deploy only fires when CI succeeded for this SHA, or
    # when a human explicitly dispatched the workflow. Any CI failure
    # (red tests, audit, docker build) leaves prod untouched.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # Required for OIDC federated login against Azure AD — the job gets a
    # short-lived token from GitHub that Azure exchanges for a service-
    # principal session, no long-lived secrets in the repo.
    permissions:
      id-token: write
      contents: read

    env:
      # For workflow_run, deploy the exact commit CI validated (not whatever
      # is at main HEAD now — main may have advanced between CI completion
      # and this job starting). For workflow_dispatch, fall back to the SHA
      # at the time of dispatch.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `az acr login` uses the Azure session above — no ACR_USERNAME /
      # ACR_PASSWORD needed. It populates Docker's credential store so
      # the subsequent build-push step can push images without a second
      # auth round-trip.
      - name: Log in to ACR
        run: az acr login --name hallismileyacr

      # The default docker driver can't export a build cache; the
      # docker-container driver can, which is what makes cache-to below work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHA layer cache so unchanged layers (notably the ~200 MB `npm ci`
      # node_modules layer) are reused across deploys instead of rebuilt and
      # pushed to ACR as brand-new blobs every time. mode=max caches the deps
      # stage too, not just the final image. provenance:false keeps the pushed
      # artifact a plain single-arch manifest — the default (an OCI index with
      # an attestation child) would change what the weekly ACR purge sees and
      # what App Service pulls.
      # BUILT_AT is stamped here, not read off the repository (its updated_at
      # moves on every push, not on this build).
      - name: Stamp the build time
        id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Three tags on one digest: `latest` (what a manual `docker pull`
      # expects), `:<sha>` (what App Service is pointed at below — the
      # RUNBOOK rollback recipe pins this form), and `:sha-<sha>` (what
      # promote.yml resolves when it retags a digest onto a release channel —
      # until 2026-09-12 that tag was never pushed, so promote could never
      # find an image). The build-args are what the Dockerfile stamps into
      # server/version.json; without them every deployed image carried
      # `1.0.0 / unknown / dev` (visible on /api/v1/system/version wherever the
      # self-update module is on — here it is off, so the route is 404 and the
      # stamp shows only in the boot log). APP_VERSION is
      # deliberately not passed — the Dockerfile reads it from package.json.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ env.DEPLOY_SHA }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}
            RELEASE_CHANNEL=stable
          tags: |
            hallismileyacr.azurecr.io/hallismiley:latest
            hallismileyacr.azurecr.io/hallismiley:${{ env.DEPLOY_SHA }}
            hallismileyacr.azurecr.io/hallismiley:sha-${{ env.DEPLOY_SHA }}

      # The digest is what promote.yml and the ACR purge operate on; having it
      # in the run summary means a rollback or a promotion can be checked
      # against what was actually pushed without querying the registry.
      - name: Record image digest
        run: |
          {
            echo "### Image"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- tags: \`latest\`, \`${DEPLOY_SHA}\`, \`sha-${DEPLOY_SHA}\`"
            echo "- built at: ${{ steps.stamp.outputs.built_at }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The post-deploy check below falls back to "a process younger than the
      # swap" for an image too old to send X-App-Build; this is that clock.
      - name: Note when the swap began
        run: echo "SWAP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: hallismiley-app
          images: hallismileyacr.azurecr.io/hallismiley:${{ env.DEPLOY_SHA }}

      # azure/webapps-deploy updates the configured image tag but on B1
      # (no slots) doesn't reliably trigger a container swap — observed on
      # 2026-04-24 where six successive successful deploys all reported
      # success while the container kept running a 10-hour-old image. Force
      # a restart so the new image is actually running. Brief (~30-60s)
      # unavailability per deploy until we move to a tier with slots.
      - name: Force restart to activate new image
        run: az webapp restart --resource-group hallismiley-rg --name hallismiley-app

      # Ported by hand from the engine's deploy.yml (engine-sync-4, 2026-09-24;
      # engine HISTORY harvest-ice-f-2026-09-24 — this workflow is product-owned,
      # so a sync never brings it). Until now this job ended at the restart and
      # a deploy whose container never swapped still went green (2026-04-24).
      # A 200 only counts from the image this run shipped: the old container
      # answers /ready perfectly well for the image being replaced (icelandicstore
      # measured ~80 s of that after a restart). Every response carries
      # X-App-Build = first 12 hex of sha256(<git sha>) (server/config/version.js
      # publicBuildTag; tests/integration/buildHeader.test.js pins the formula
      # below to it) — the Dockerfile stamps the GIT_SHA build-arg passed above.
      # An image too old to send the header falls back to the uptime rule: a
      # process YOUNGER than the swap. /ready is exempt from the canonical-host
      # redirect, so the azurewebsites.net hostname answers it directly.
      - name: Post-deploy health check
        run: |
          set -uo pipefail
          url="https://hallismiley-app.azurewebsites.net"
          want="$(printf '%s' "$DEPLOY_SHA" | sha256sum | cut -c1-12)"
          echo "Expecting X-App-Build: $want"
          code="000"; uptime=""; got=""
          for i in $(seq 1 60); do
            hdr="$(mktemp)"
            code=$(curl -s -D "$hdr" -o /tmp/ready.json -w '%{http_code}' "$url/ready" || true)
            # '|| true' on every pipeline: while the container restarts /ready can
            # answer with an EMPTY body and no header, and under pipefail one
            # failed grep would end the check instead of retrying.
            got="$(grep -i '^x-app-build:' "$hdr" | tail -1 | tr -d '\r' | awk '{print $2}' || true)"
            if [ "$code" = "200" ]; then
              uptime=$(jq -r '.uptime // empty' /tmp/ready.json 2>/dev/null || true)
              age=$(( $(date +%s) - SWAP_STARTED_AT ))
              if [ -n "$got" ] && [ "$got" != "dev" ] && [ "$got" != "unknown" ]; then
                if [ "$got" = "$want" ]; then
                  echo "/ready OK after ~$((i*5))s from the shipped build (X-App-Build $got)"
                  cat /tmp/ready.json; exit 0
                fi
              elif printf '%s' "$uptime" | grep -Eq '^[0-9]+$' && [ "$uptime" -le "$age" ]; then
                echo "/ready OK after ~$((i*5))s (no build tag to compare; process uptime ${uptime}s, swap began ${age}s ago)"
                cat /tmp/ready.json; exit 0
              fi
            fi
            sleep 5
          done
          if [ "$code" = "200" ]; then
            echo "::error::$url/ready answers 200, but not as the shipped build (X-App-Build ${got:-<none>}, want $want; uptime ${uptime:-?}s) — the container swap never happened."
          else
            echo "::error::$url/ready never returned 200 (last HTTP $code)"
          fi
          cat /tmp/ready.json || true
          exit 1

  # ── Failsafe: email halli@hallismiley.is when merged code does NOT go live ──
  # Two distinct "merged but not live" causes are covered:
  #   1. CI went red on main  → the deploy job above is SKIPPED (fail-closed).
  #   2. the deploy job RAN but errored (ACR/build/webapp/restart).
  # Both email via Resend (the app's provider). They no-op cleanly if the
  # RESEND_API_KEY secret isn't set, and run independently of `deploy` so an
  # alert can never block or break a deploy.

  alert-ci-blocked:
    name: Alert — CI not green on main (deploy skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fires whenever CI completed on main WITHOUT success — i.e. the exact
    # moment the deploy is being skipped. A manual workflow_dispatch never
    # reaches this branch.
    #
    # `cancelled` used to be excluded on the theory that a cancelled run is a
    # benign supersession. 2026-08-19 proved that wrong twice in one day: a
    # hung Playwright download cancelled main's CI at its timeout, and a merge
    # burst had GitHub's one-pending-slot concurrency rule cancel queued main
    # runs — in both cases merged code silently never deployed and nothing
    # went red. Cancelled now alerts AND fails this run (see the last step),
    # so "merged but not live" is always loud. A benign supersession costs one
    # red run + one email; silence cost hours. (Ported policy from
    # icelandicstore #164.)
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    steps:
      - name: Email deploy-blocked alert (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          CI_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY not set — skipping deploy-blocked alert."; exit 0
          fi
          SHORT_SHA="${CI_SHA:0:9}"
          # jq builds the JSON so any character in the commit title/url is safely escaped.
          jq -n \
            --arg subj "⚠️ hallismiley — merged code did NOT deploy (CI ${CI_CONCLUSION} on main)" \
            --arg concl "$CI_CONCLUSION" \
            --arg sha "$SHORT_SHA" \
            --arg title "$CI_TITLE" \
            --arg url "$CI_URL" \
            '{
               from: "Hallismiley Deploy <noreply@hallismiley.is>",
               to: ["halli@hallismiley.is"],
               subject: $subj,
               html: ("<h2>⚠️ Merged code did NOT deploy</h2>"
                 + "<p>CI finished <strong>" + $concl + "</strong> on <code>main</code> for commit <code>" + $sha + "</code> — " + $title + ".</p>"
                 + "<p>The Azure deploy is gated on green CI, so it was <strong>skipped</strong>. The merged code is <strong>not live</strong>. Fix CI and it will auto-deploy, or run the “Deploy to Azure” workflow manually.</p>"
                 + "<p><a href=\"" + $url + "\">View the CI run →</a></p>")
             }' \
            | curl -sS --fail-with-body -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d @-
          echo "Deploy-blocked alert emailed to halli@hallismiley.is."

      # A skipped deploy must not read as a green run in the Actions list —
      # that is exactly how the 2026-08-19 non-deploys stayed invisible.
      - name: Fail the run so the skip is visible
        run: |
          echo "::error::CI concluded '${{ github.event.workflow_run.conclusion }}' on main — deploy skipped, merged code is NOT live."
          exit 1

  alert-deploy-failed:
    name: Alert — Azure deploy failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    # Only when the deploy job actually RAN and failed (not when it was skipped
    # because CI was red — that case is covered by alert-ci-blocked above).
    #
    # always() is load-bearing, not decoration. An `if:` that contains no status
    # function still has the implicit success() gate applied to `needs`, so a
    # failed deploy SKIPS this job and the alert never fires — which is exactly
    # what happened on 2026-08-07, when a registry 504 failed the deploy of
    # 112d5a8 in silence. always() lifts that gate so the result check is
    # actually reached.
    if: ${{ always() && needs.deploy.result == 'failure' }}
    steps:
      - name: Email deploy-failed alert (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY not set — skipping deploy-failed alert."; exit 0
          fi
          SHORT_SHA="${DEPLOY_SHA:0:9}"
          jq -n \
            --arg sha "$SHORT_SHA" \
            --arg url "$RUN_URL" \
            '{
               from: "Hallismiley Deploy <noreply@hallismiley.is>",
               to: ["halli@hallismiley.is"],
               subject: "⚠️ hallismiley — Azure deploy FAILED",
               html: ("<h2>⚠️ Azure deploy failed</h2>"
                 + "<p>The deploy job for <code>main</code> (commit <code>" + $sha + "</code>) errored, so the merged code is <strong>not live</strong> on Azure.</p>"
                 + "<p><a href=\"" + $url + "\">View the deploy run →</a></p>")
             }' \
            | curl -sS --fail-with-body -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d @-
          echo "Deploy-failed alert emailed to halli@hallismiley.is."
