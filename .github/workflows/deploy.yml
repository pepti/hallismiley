name: Deploy to Azure

# ── NEUTRALIZED (ENHANCEMENTS #1, 2026-08-19) ────────────────────────────────
# The base's deploy.yml was inherited verbatim and aimed at the owner's
# PERSONAL Azure resources (hallismileyacr / hallismiley-app) with an
# auto-trigger on green CI — one push to a wired-up remote away from deploying
# this repo over the live personal site.
#
# This rewrite makes the workflow inert-by-default, the same pattern as
# promote.yml: manual dispatch only, and every target read from repo
# variables that DO NOT EXIST yet. Until Halli provisions the company Azure
# stack and sets the vars, a dispatch fails fast at the guard step and
# touches nothing. Arming it later = set vars, no workflow edit:
#   vars.ACR_NAME · vars.IMAGE_NAME · vars.WEBAPP_NAME · vars.RESOURCE_GROUP
#   secrets.AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#   (optional) vars.ALERT_EMAIL_TO / vars.ALERT_EMAIL_FROM + secrets.RESEND_API_KEY
#
# The auto-deploy-on-green-CI trigger (workflow_run) is deliberately NOT kept:
# re-adding it is a decision for when the company stack exists, and belongs in
# the same review as the release-channel rollout (promote.yml canary→stable).
on:
  workflow_dispatch:

permissions:
  contents: read

# Two deploys must never interleave (each ends in a webapp restart); queue
# them instead of cancelling — a cancelled deploy would strand main un-shipped.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Required for OIDC federated login against Azure AD — the job gets a
    # short-lived token from GitHub that Azure exchanges for a service-
    # principal session, no long-lived secrets in the repo.
    permissions:
      id-token: write
      contents: read

    env:
      DEPLOY_SHA: ${{ github.sha }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      WEBAPP_NAME: ${{ vars.WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}

    steps:
      # Inert-by-default guard: with the repo variables unset (the state of
      # this repo until the company Azure stack exists), fail here — before
      # login, before any resource is touched.
      - name: Guard — require deploy target variables
        run: |
          missing=""
          for v in ACR_NAME IMAGE_NAME WEBAPP_NAME RESOURCE_GROUP; do
            eval "val=\${$v}"
            [ -z "$val" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy target not configured — unset repo variables:$missing"
            echo "This workflow is neutralized until the company Azure stack exists (ENHANCEMENTS #1)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `az acr login` uses the Azure session above — no ACR_USERNAME /
      # ACR_PASSWORD needed.
      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      # The default docker driver can't export a build cache; the
      # docker-container driver can, which is what makes cache-to below work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # provenance:false keeps the pushed artifact a plain single-arch manifest —
      # the default (an OCI index with an attestation child) would change what
      # an ACR purge sees and what App Service pulls.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Stamp the image with its own identity — server/version.json. Without
          # these the container boots reporting gitSha "unknown", and the
          # self-update checker cannot tell whether a published release is newer
          # than what is running (docs/SELF-UPDATE.md).
          build-args: |
            GIT_SHA=${{ env.DEPLOY_SHA }}
            BUILT_AT=${{ github.event.repository.updated_at }}
            RELEASE_CHANNEL=stable
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:latest
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:sha-${{ env.DEPLOY_SHA }}

      # The digest is the identity the release channel publishes and the
      # platform pulls. Print it so a promote run can be given the exact bytes
      # this deploy produced, rather than "whatever :sha-… resolves to later".
      - name: Record image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "### Deployed image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "sha:    ${{ env.DEPLOY_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Scanned after the push but BEFORE the web app is pointed at it: an
      # unreferenced image sitting in ACR serves no traffic, so this is the
      # moment that actually matters. A HIGH/CRITICAL finding leaves the running
      # version untouched.
      - name: Scan pushed image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:sha-${{ env.DEPLOY_SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}
          images: ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}

      # azure/webapps-deploy updates the configured image tag but on tiers
      # without slots doesn't reliably trigger a container swap (observed on
      # the base 2026-04-24: six successful deploys, container kept a
      # 10-hour-old image). Force a restart so the new image actually runs.
      - name: Force restart to activate new image
        run: az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"

  # ── Failsafe: email when a dispatched deploy errored ─────────────────────────
  # No-ops cleanly unless vars.ALERT_EMAIL_TO/FROM and secrets.RESEND_API_KEY
  # are all set. (The base's second alert — CI-red-on-main blocking an
  # auto-deploy — is gone with the workflow_run trigger.)
  alert-deploy-failed:
    name: Alert — Azure deploy failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    # always() is load-bearing, not decoration. An `if:` that contains no status
    # function still has the implicit success() gate applied to `needs`, so a
    # failed deploy SKIPS this job and the alert never fires — which is exactly
    # what happened on the base 2026-08-07, when a registry 504 failed a deploy
    # in silence. always() lifts that gate so the result check is reached.
    if: ${{ always() && needs.deploy.result == 'failure' }}
    steps:
      - name: Email deploy-failed alert (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL_TO" ] || [ -z "$ALERT_EMAIL_FROM" ]; then
            echo "Alert email not configured (RESEND_API_KEY / ALERT_EMAIL_TO / ALERT_EMAIL_FROM) — skipping."; exit 0
          fi
          SHORT_SHA="${DEPLOY_SHA:0:9}"
          jq -n \
            --arg from "Orange Smiley Deploy <$ALERT_EMAIL_FROM>" \
            --arg to "$ALERT_EMAIL_TO" \
            --arg sha "$SHORT_SHA" \
            --arg url "$RUN_URL" \
            '{
               from: $from,
               to: [$to],
               subject: "⚠️ orangesmiley — Azure deploy FAILED",
               html: ("<h2>⚠️ Azure deploy failed</h2>"
                 + "<p>The dispatched deploy (commit <code>" + $sha + "</code>) errored, so the code is <strong>not live</strong> on Azure.</p>"
                 + "<p><a href=\"" + $url + "\">View the deploy run →</a></p>")
             }' \
            | curl -sS --fail-with-body -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d @-
          echo "Deploy-failed alert emailed."
