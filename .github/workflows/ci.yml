name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only needs to read the repo. Actions are SHA-pinned (with a
# `# vN` comment dependabot keeps in sync) so a hijacked tag can't run
# arbitrary code with our token.
permissions:
  contents: read

# Superseded PR pushes cancel their in-flight run; main runs are NEVER
# cancelled — a `cancelled` CI conclusion on main would skip the deploy AND
# fire the deploy-blocked alert email for a commit that was simply superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint + Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       hallismiley_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: i18n keys in sync
        run: npm run check:i18n

      - name: Run tests with coverage
        env:
          NODE_ENV:            test
          TEST_DATABASE_URL:   postgresql://postgres:postgres@localhost:5432/hallismiley_test
          # ADMIN_USERNAME / ADMIN_PASSWORD_HASH are set by tests/env.js
        run: npm run test:ci

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       hallismiley_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci


      # The browser download from the Playwright CDN intermittently hangs until
      # the job's 30-minute timeout kills it (4× on 2026-08-19) — and on main a
      # cancelled job cancels the whole CI run, which deploy.yml fail-closes on:
      # merged code silently never reaches TEST. So: cache the browser binaries
      # keyed on the installed Playwright version (the common path never touches
      # the CDN), and on a miss bound each download attempt and retry instead of
      # hanging for the whole job budget.
      # GitHub's Ubuntu runners resolve apt through /etc/apt/apt-mirrors.txt,
      # which lists Azure's mirror first. On 2026-08-19 that mirror stopped
      # answering entirely: apt spent its whole retry budget on `Ign:` lines
      # before falling back to archive.ubuntu.com, and the 8-minute OS-deps step
      # below timed out twice in a row — on `main`, which left a merged commit
      # unable to reach TEST at all.
      #
      # Dropping the dead hop and bounding apt's own network waits fixes both
      # apt paths in this job (the cache-miss `install --with-deps` uses apt too,
      # it just usually finishes inside its larger budget).
      - name: Pin apt away from the flaky Azure mirror
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "before:"; cat /etc/apt/apt-mirrors.txt
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            # Never leave the mirrorlist empty if the file format ever changes.
            if ! grep -q . /etc/apt/apt-mirrors.txt; then
              printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' \
                | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            echo "after:"; cat /etc/apt/apt-mirrors.txt
          else
            echo "no /etc/apt/apt-mirrors.txt on this runner image — nothing to pin"
          fi
          # apt's defaults wait a long time per unreachable host. Bound them so a
          # dead mirror costs seconds, not the whole step budget.
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "2";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # restore + save as SEPARATE steps rather than one `actions/cache`: the
      # combined action saves in its post-job hook even when a later step
      # failed, which would publish a half-downloaded browser directory under
      # this key and break every subsequent run. Saving explicitly (and only on
      # success — an `if:` without a status function still implies success())
      # means a failed install poisons nothing.
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 18
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt ${attempt} failed or hung after 5 minutes — retrying"
          done
          echo "::error::Playwright browser install failed after 3 attempts"
          exit 1

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The cache holds only ~/.cache/ms-playwright — the browsers' OS packages
      # still need installing on every runner, via apt.
      #
      # This used to say apt "doesn't share the hang" of the Playwright CDN.
      # That was wrong: on 2026-08-19 the Azure mirror took this step over its
      # 8-minute timeout twice consecutively. It now retries on a bounded clock,
      # matching the browser-install step above, so one bad mirror response
      # costs a retry rather than the job.
      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright OS dep install attempt ${attempt} failed or hung after 3 minutes — retrying"
            sudo apt-get update || true
          done
          echo "::error::Playwright OS dependency install failed after 3 attempts"
          exit 1

      - name: Run E2E tests
        env:
          CI:              "true"
          NODE_ENV:        test
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hallismiley_e2e_ci_test
          DATABASE_URL:    postgresql://postgres:postgres@localhost:5432/hallismiley_e2e
          ALLOWED_ORIGINS: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build + boot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate on test — otherwise a green Docker job can mask a red test job
    # at the workflow-summary level, and the workflow_run trigger in
    # deploy.yml only sees the overall conclusion.
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       hallismiley_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t hallismiley:smoke .

      # Boot the production image against an empty database: proves the
      # container starts, the migration runner applies the full chain from
      # scratch, and the app reaches /health + /ready — the same sequence a
      # real Azure deploy performs. Catches broken migrations before merge.
      - name: Boot smoke test
        run: |
          # UPLOAD_ROOT: paths.js fails a production boot without it (the
          # ephemeral-disk guard) — declare it like a real deploy does.
          # DB_SSL=false: the runner's Postgres speaks plain TCP; production
          # defaults to TLS-on, and this is the one documented opt-out case,
          # never Azure.
          docker run -d --name smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hallismiley_smoke \
            -e DB_SSL=false \
            -e UPLOAD_ROOT=/app/uploads \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            -e CSRF_SECRET=$(openssl rand -hex 32) \
            hallismiley:smoke
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "/health OK after ~$((i*2))s"
              break
            fi
            if [ "$i" = "45" ]; then
              echo "Container never became healthy:"; docker logs smoke; exit 1
            fi
            sleep 2
          done
          # Assert on the status code, not just curl --fail: --fail ignores 3xx,
          # so a redirected /ready would pass this step without ever reporting.
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:3000/ready)
          if [ "$code" != "200" ]; then
            echo "/ready returned HTTP $code (expected 200):"; cat /tmp/ready.json
            docker logs smoke; exit 1
          fi
          echo "/ready OK:"; cat /tmp/ready.json

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true
